<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free Library — Wikipedia-style digital archive for free PDF books. Instant downloads, no account required." />
    <title>Free Library</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <!-- Fonts: Wikipedia-style Linux Libertine / Source Serif + Source Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />
    
    <!-- Instant Zero-FOUC Theme Initializer -->
    <script>
        (function() {
            var saved = localStorage.getItem('library-theme');
            var pref = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', pref);
        })();
        window.toggleTheme = function() {
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('library-theme', next);
            return next;
        };
        window.getTheme = function() {
            return document.documentElement.getAttribute('data-theme') || 'light';
        };
    </script>

    <link rel="stylesheet" href="css/wiki.css" />
    <!-- Standard Blazor WebAssembly plumbing -->
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="initial-loader">
            <div class="loader-spinner"></div>
            <p>Loading library catalogue...</p>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
