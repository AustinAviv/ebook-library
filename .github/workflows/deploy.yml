# ─────────────────────────────────────────────────────────────────────────────
# Free Library — CI/CD
#
# Trigger: any push to master
# What it does automatically:
#   1. Uploads any new PDFs in pdfs/ to Vercel Blob
#   2. Rebuilds books.json (title = filename, no manual editing needed)
#   3. Builds the Blazor WASM site
#   4. Copies build output to public/
#   5. Deploys to Vercel (production)
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Add books
        run: dotnet run --project tools/LibraryTool -- add-books ./pdfs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Build Blazor
        run: dotnet publish src/WikiLibrary -c Release -o .publish

      - name: Copy site
        run: dotnet run --project tools/LibraryTool -- copy-site

      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_5OXcQLxMeB6kAFot37ONfl7v' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_OvWQrBUsyfzJBE9DSR0QdgqJhNzf' }}

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/WikiLibrary/wwwroot/data/books.json api/_catalog.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: auto-update books catalog [skip ci]"
            git push
          fi
